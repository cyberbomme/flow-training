<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock</title>
<link rel="stylesheet" href="../app.css">
<style>
  /* Konzept-Mock: echtes App-CSS, nur die neuen Teile stehen hier */
  body { min-height: 100vh; }
  .tap { position: relative; cursor: pointer; }
  .ic-circle.tap { overflow: visible; }
  .ic-circle.tap > svg { border-radius: 50%; overflow: hidden; }
  .ib { position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; background: var(--color-forest); color: #fff; display: grid; place-items: center; font: 600 12px/1 var(--font-body); border: 2px solid var(--color-surface); }
  .tr-hero { position: relative; }
  .tr-hero .ib { width: 34px; height: 34px; font-size: 17px; right: calc(50% - 112px); bottom: 14px; border-color: var(--color-bg); }
  .ibtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--color-fill); color: var(--color-forest); font: 600 16px/1 var(--font-body); cursor: pointer; display: grid; place-items: center; }
  .prow-main .ibtn { margin-right: -8px; }
  .next-card .ibtn { margin-left: auto; }
  .name-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .name-row .tr-name { min-width: 0; }
  .name-row .ibtn { margin-top: 16px; }
  .info-sheet { text-align: left; max-height: 86vh; overflow: auto; gap: 14px; }
  .info-sheet .serif { margin: 0; }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mini-t { flex: none; background: var(--color-peach); color: var(--color-text); border-radius: 999px; padding: 6px 12px; font: 600 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .info-sheet .fig-hero, .full .fig-hero { margin: 0; height: 190px; max-height: none; aspect-ratio: auto; }
  .full { position: fixed; inset: 0; z-index: 40; background: var(--color-bg); overflow: auto; padding: 16px 16px 40px; display: grid; gap: 14px; align-content: start; text-align: left; }
  .full h1 { margin: 0; }
  .back-b { border: 0; background: none; color: var(--color-forest); font: inherit; padding: 0; text-align: left; cursor: pointer; }
  .flip { background: var(--color-sage-light); border-radius: var(--r-box); height: min(60vw, 250px); box-sizing: border-box; overflow: auto; text-align: left; padding: 14px 16px; cursor: pointer; font-size: 15px; line-height: 1.4; }
  .flip.rose { background: var(--color-peach); }
  .flip b { display: block; }
  .flip ul { margin: 2px 0 0; padding-left: 18px; }
  .flip small { color: var(--color-text-muted); display: block; margin-top: 8px; }
  .inl { padding: 0 2px; font-size: 15px; line-height: 1.45; display: grid; gap: 8px; user-select: text; }
  .inl .fig-hero { margin: 0; height: 150px; max-height: none; aspect-ratio: auto; }
  .inl ul { margin: 0; padding-left: 18px; color: var(--color-text-muted); }
  .hintline { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; color: var(--color-text-muted); }
</style>
</head>
<body>
<main id="main"></main><div id="ov"></div>
<script type="module">
import S from './konzept-info-screens.js';
import { byId, TEMPO } from '../js/exercises.js';
import { animateFigure, figureStatic } from '../js/figure.js';
const q = new URLSearchParams(location.search), c = q.get('c') || 'a', s = q.get('s') || 'plan';
const $ = (x, r = document) => r.querySelector(x), $$ = (x, r = document) => [...r.querySelectorAll(x)];
const IDS = { a: 'seit-frontheben', b: 'kniebeuge', c: 'reverse-flys', d: 'unterarmstuetz', e: 'burpee' }, CUR = 'seit-frontheben';
const scr = S[s === 'plan' && c === 'c' ? 'planopen' : s];
document.body.dataset.view = scr.view; $('#main').innerHTML = scr.html;
$$('#main [data-anim]').forEach((el) => animateFigure(el, byId[el.dataset.anim], { period: 4 }));

// Laufende Pause: der Timer läuft auch bei geöffneter Info weiter
let left = 60; const fmt = (x) => `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`;
if (s === 'rest') setInterval(() => { left = left ? left - 1 : 60; $$('#tdisp, .mini-t').forEach((e) => { e.textContent = fmt(left); }); }, 1000);

const bulb = '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
const check = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const body = (e) => `<div class="fig-hero" data-fig="${e.id}"></div>
  <div class="info-box" style="margin:0"><span class="ic">${bulb}</span><div><b>So geht’s</b><p>${e.how}</p></div></div>
  ${e.cues?.length ? `<ul class="checklist">${e.cues.map((x) => `<li><span class="ck">${check}</span><span>${x}</span></li>`).join('')}</ul>` : ''}`;
const run = (root) => $$('[data-fig]', root).forEach((el) => animateFigure(el, byId[el.dataset.fig], { period: TEMPO[el.dataset.fig] ?? 3 }));
const close = () => { $('#ov').innerHTML = ''; };
const mini = s === 'rest' ? `<span class="mini-t">${fmt(left)}</span>` : '';
function sheet(id) {
  const e = byId[id];
  $('#ov').innerHTML = `<div class="sheet-bg"></div><div class="sheet info-sheet"><div class="sheet-top"><p class="serif">${e.name}</p>${s === 'rest' ? `<span class="mini-t">${fmt(left)}</span>` : ''}</div>${body(e)}<button class="btn big x">Schließen</button></div>`;
  run($('#ov')); $('.sheet-bg').onclick = close; $('.x').onclick = close;
}
function full(id) {
  const e = byId[id];
  $('#ov').innerHTML = `<div class="full"><div class="sheet-top"><button class="back-b">‹ Zurück ${s === 'plan' ? 'zum Plan' : 'zum Training'}</button>${s === 'rest' ? `<span class="mini-t">${fmt(left)}</span>` : ''}</div><h1>${e.name}</h1>${body(e)}</div>`.replace('‹ ', '<svg viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-3px"><path d="M15 5l-7 7 7 7"/></svg>');
  run($('#ov')); $('.back-b').onclick = close;
}
const on = (el, fn) => el && el.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
const rows = $$('.prow[data-id]').filter((r) => IDS[r.dataset.id]);

if (c === 'a') { // Figur antippen → Sheet
  rows.forEach((r) => { const i = $('.ic-circle', r); i.classList.add('tap'); i.insertAdjacentHTML('beforeend', '<span class="ib">i</span>'); on(i, () => sheet(IDS[r.dataset.id])); });
  if (s === 'work') { $('.tr-hero').insertAdjacentHTML('beforeend', '<span class="ib">i</span>'); $('.tr-hero').classList.add('tap'); on($('.tr-hero'), () => sheet(CUR)); }
  if (s === 'rest') { const i = $('.next-card .ic-circle'); i.classList.add('tap'); i.insertAdjacentHTML('beforeend', '<span class="ib">i</span>'); $('.next-card').style.cursor = 'pointer'; on($('.next-card'), () => sheet(CUR)); }
}
if (c === 'b') { // eigener Info-Knopf → ganze Seite
  rows.forEach((r) => { $('.handle', r).insertAdjacentHTML('beforebegin', '<button class="ibtn" aria-label="Anleitung">i</button>'); on($('.ibtn', r), () => full(IDS[r.dataset.id])); });
  if (s === 'work') { const n = $('.tr-name'); n.outerHTML = `<div class="name-row">${n.outerHTML}<button class="ibtn" aria-label="Anleitung">i</button></div>`; on($('.ibtn'), () => full(CUR)); }
  if (s === 'rest') { $('.next-card').insertAdjacentHTML('beforeend', '<button class="ibtn" aria-label="Anleitung">i</button>'); on($('.ibtn'), () => full(CUR)); }
}
if (c === 'c') { // Anleitung erscheint am selben Platz
  if (s === 'plan') {
    const f = $('.pfields'), vals = [...f.children];
    f.insertAdjacentHTML('afterbegin', '<div class="seg"><button class="on" data-k="v">Werte</button><button data-k="i">Anleitung</button></div>');
    const e = byId[CUR], box = document.createElement('div'); box.className = 'inl'; box.hidden = true;
    box.innerHTML = `<div class="fig-hero" data-fig="${e.id}"></div><span>${e.how}</span><ul>${e.cues.map((x) => `<li>${x}</li>`).join('')}</ul>`; f.append(box); run(box);
    $$('[data-k]', f).forEach((b) => on(b, () => { const i = b.dataset.k === 'i'; $$('[data-k]', f).forEach((x) => x.classList.toggle('on', x === b)); vals.forEach((v) => { v.style.display = i ? 'none' : ''; }); box.hidden = !i; box.style.display = i ? '' : 'none'; }));
    box.style.display = 'none';
  } else {
    const h = $('.tr-hero'), old = h.innerHTML, e = byId[CUR]; let open = false;
    const flip = () => { open = !open; h.innerHTML = open ? `<div class="flip ${s === 'rest' ? 'rose' : ''}"><b>${s === 'rest' ? e.name : 'So geht’s'}</b>${e.how}<ul>${e.cues.map((x) => `<li>${x}</li>`).join('')}</ul><small>Antippen: zurück</small></div>` : old; if (!open) $$('[data-anim]', h).forEach((el) => animateFigure(el, byId[el.dataset.anim], { period: 4 })); };
    if (s === 'work') { h.classList.add('tap'); on(h, flip); } else { $('.next-card').style.cursor = 'pointer'; on($('.next-card'), flip); on(h, () => open && flip()); }
  }
}
if (q.get('open')) { if (c === 'a') (s === 'work' ? $('.tr-hero') : s === 'rest' ? $('.next-card') : $('.prow .ic-circle')).click(); if (c === 'b') $('.ibtn').click(); if (c === 'c') (s === 'plan' ? $('[data-k=i]') : s === 'work' ? $('.tr-hero') : $('.next-card')).click(); }
</script>
</body>
</html>
