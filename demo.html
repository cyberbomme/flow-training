<!doctype html>
<html lang="de">
<head>

  <script>
    try {
      var t = localStorage.getItem('flow.theme'), d = localStorage.getItem('flow.design');

      if (d && d !== 'flow') document.documentElement.dataset.design = d;
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="app.css">
</head>
